name = "line-crm-worker"
main = "src/index.ts"
compatibility_date = "2024-12-01"
workers_dev = true

# API_KEY is set via `wrangler secret put API_KEY`
# Do NOT hardcode secrets here

[vars]
WORKER_URL = "https://line-crm-worker.sogadaiki.workers.dev"

[[d1_databases]]
binding = "DB"
database_name = "sadame-line-crm"
database_id = "973f09e0-a762-434e-9861-07279a28510e"

[triggers]
crons = ["*/5 * * * *"]
