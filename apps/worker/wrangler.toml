name = "line-crm-worker"
main = "src/index.ts"
compatibility_date = "2024-12-01"
workers_dev = true

[vars]
WORKER_URL = "https://line-crm-worker.sogadaiki.workers.dev"

[assets]
directory = "dist/client"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "sadame-line-crm"
database_id = "973f09e0-a762-434e-9861-07279a28510e"
migrations_dir = "../../packages/db/migrations"

# R2 bucket — create with `wrangler r2 bucket create line-harness-images` before enabling
# [[r2_buckets]]
# binding = "IMAGES"
# bucket_name = "line-harness-images"

[triggers]
crons = ["*/30 * * * *"]
